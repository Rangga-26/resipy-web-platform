name: CI/CD Pipeline - Cloudflare Pages & Gateway

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Lint & Validation Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend GPS & Inversion Tests
        run: |
          python -m unittest discover -s gps_maps -p "test_*.py"

      - name: Validate Cloudflare Worker Syntax
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node -c edge/_worker.js

  deploy:
    name: Deploy to Cloudflare Workers / Pages
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Cloudflare Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice ::CLOUDFLARE_API_TOKEN secret belum diset di repository settings. Langkah deployment diskip."
          fi

      - name: Setup Node.js
        if: steps.check_creds.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare
        if: steps.check_creds.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
